name: Zero-Bloat CI & Health Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify:
    name: Verify Skills & Architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "examples/starter-app/requirements.txt"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r examples/starter-app/requirements.txt pyyaml httpx

      - name: Run Unified Test Suite
        run: |
          chmod +x test.sh install.sh uninstall.sh
          ./test.sh
